name: news_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # المكتبات الأساسية والشبكات (تم هندلتها للتوافق التام)
  http: ^1.2.1
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  retrofit: 4.1.0
  json_annotation: 4.8.1 # تم تثبيت النسخة دي لإنهاء تعارض json_serializable

  # واجهة المستخدم والتصميم
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  flutter_native_splash: ^2.4.0

  # إدارة الحالة والترجمة
  provider: ^6.1.2
  easy_localization: ^3.0.7
  dropdown_button2: ^2.3.9

  # أدوات إضافية
  timeago: ^3.6.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # الثلاثي المستقر (نسخ مختارة بدقة لتفادي ايرور الـ Mapper)
  retrofit_generator: 7.0.8
  build_runner: 2.4.6
  json_serializable: 6.7.1

flutter:
  uses-material-design: true

  # تأكدي من وجود الفولدرات دي في مشروعك فعلياً
  assets:
    - assets/animations/
    - assets/images/
    - assets/translations/